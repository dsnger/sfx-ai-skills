<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aufgaben</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#5b6475;--accent:#3a5bd9;--warn:#b25e00;--warn-surface:#fff4e5;--ok:#1d7a4c}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:880px;margin:0 auto;padding:32px 20px}
h1{font-size:24px;margin:0 0 16px}
.notice{background:var(--warn-surface);border-left:4px solid var(--warn);padding:12px 16px;border-radius:8px;margin-bottom:20px}
.list{display:flex;flex-direction:column;gap:8px}
.task{background:var(--card);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;box-shadow:0 1px 2px rgb(0 0 0/.06)}
.task.selected{border-left:4px solid var(--accent)}
.task.overdue{box-shadow:inset 3px 0 0 var(--warn),0 1px 2px rgb(0 0 0/.06)}
.task .meta{color:var(--muted);font-size:14px}
.hint{position:relative;background:var(--card);border-radius:10px;padding:14px 16px 14px 22px;margin-top:24px}
.hint::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--ok);border-radius:10px 0 0 10px}
blockquote{margin:24px 0 0;padding:8px 16px;border-right:3px solid var(--accent);color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Aufgaben</h1>
<div class="notice">Zwei Aufgaben sind überfällig.</div>
<div class="list">
  <div class="task selected"><span>Angebot für Relaunch schreiben</span><span class="meta">heute</span></div>
  <div class="task overdue"><span>Rechnung März prüfen</span><span class="meta">seit 3 Tagen</span></div>
  <div class="task overdue"><span>Feedback zum Entwurf einarbeiten</span><span class="meta">seit 1 Tag</span></div>
  <div class="task"><span>Termin mit Team abstimmen</span><span class="meta">Freitag</span></div>
</div>
<div class="hint">Tipp: Mit der Taste N legst du eine neue Aufgabe an.</div>
<blockquote>Erledigt ist besser als perfekt.</blockquote>
</main>
</body>
</html>
