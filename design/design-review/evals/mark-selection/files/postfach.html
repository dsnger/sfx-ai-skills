<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Postfach</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2130;--muted:#596273;--accent:#2f5bea;--warn:#9a4b00}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:28px 20px}
.warning{color:var(--warn);font-size:14px;margin-bottom:16px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:0 1px 2px rgb(0 0 0/.06)}
li .from{font-size:15px}
li .subject{color:var(--muted);font-size:14px}
li.selected .from{color:#24314f}
li.unread .from{color:#1b2130}
</style>
</head>
<body>
<main>
<p class="warning">Dein Speicher ist zu 95 % voll. Neue Nachrichten können ab morgen nicht mehr empfangen werden.</p>
<ul>
  <li class="selected"><div class="from">Lena Hoff</div><div class="subject">Entwurf Startseite, Version 3</div></li>
  <li class="unread"><div class="from">Buchhaltung</div><div class="subject">Rechnung 2026-114</div></li>
  <li class="unread"><div class="from">Tom Berger</div><div class="subject">Termin Donnerstag</div></li>
  <li><div class="from">Newsletter</div><div class="subject">Neuigkeiten im November</div></li>
</ul>
</main>
</body>
</html>
