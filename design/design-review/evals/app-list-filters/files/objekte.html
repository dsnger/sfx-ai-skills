<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objekte</title>
<style>body{margin:0;font-family:system-ui;font-size:13px;color:#555}.bar{display:flex;gap:8px;padding:12px;background:#f3f1f7}
.list .item{display:flex;gap:10px;padding:8px;border-bottom:2px solid #000}.item img{width:48px;height:48px;border-radius:50%}
.item .name{font-size:13px}.item .meta{font-size:12px;color:#777}.photo{position:relative}.photo span{position:absolute;bottom:4px;left:4px;color:#fff;font-size:11px}</style></head><body>
<div class="bar"><input placeholder="Suchen..."><select><option>Filter</option><option>Ort: Berlin</option><option>Ort: Hamburg</option><option>Zimmer: 1</option><option>Zimmer: 2</option><option>Zimmer: 3</option><option>Preis bis 800</option><option>Preis bis 1200</option><option>Status: frei</option><option>Status: vermietet</option></select><select><option>Sortieren</option><option>Preis</option><option>Datum</option></select></div>
<div class="list">
<div class="item"><div class="photo"><img src="a.jpg"><span>Ferienwohnung Seeblick, 2 Zi., 95 €/Nacht</span></div><div><div class="name">Ferienwohnung Seeblick</div><div class="meta">Berlin · 2 Zimmer · 95 € · frei · 4,8 ★ · 54 m² · WLAN</div></div></div>
<div class="item"><div class="photo"><img src="b.jpg"><span>Studio Mitte, 1 Zi., 70 €/Nacht</span></div><div><div class="name">Studio Mitte</div><div class="meta">Berlin · 1 Zimmer · 70 € · vermietet · 4,5 ★ · 30 m²</div></div></div>
</div>
<!-- Bei 0 Treffern zeigt die App eine leere weiße Fläche. Beim Laden erscheint nichts, bis die Daten da sind. -->
</body></html>
