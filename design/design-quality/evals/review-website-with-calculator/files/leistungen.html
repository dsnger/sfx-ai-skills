<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leistungen</title>
<style>body{margin:0;font-family:Georgia}header{padding:16px 24px;background:#0c0a2b;color:#fff}.hero{padding:60px 24px;background:#231d5c;color:#fff}
h1{font-size:44px;font-family:Impact}h2{font-size:34px;font-family:Arial}.card{border:1px solid #ccc;padding:14px;border-radius:2px;margin:10px}
.calc{padding:24px;margin:22px;background:#f3f1f7}.calc label{display:block;margin-top:12px}button{padding:14px 30px;background:#4e4cf2;color:#fff;border:0;text-transform:uppercase;font-size:18px}
.note{font-size:11px;color:#999}</style></head><body>
<header>Webstudio Beispiel</header>
<div class="hero"><h1>Websites, die wirken</h1><p>Wir bauen Ihre Website.</p></div>
<section style="padding:24px"><h2>Leistungen</h2>
<div class="card" style="border-radius:16px">Webdesign</div><div class="card">Entwicklung</div><div class="card" style="border-radius:8px">Wartung</div></section>
<section class="calc"><h2>Kostenrechner</h2>
<label>Anzahl Seiten <input type="text"></label>
<label>Mehrsprachig? <select><option></option><option>Ja</option><option>Nein</option></select></label>
<label>Shop <input type="checkbox"></label>
<label>Wartungspaket <input type="checkbox" checked> (49 €/Monat)</label>
<label>Newsletter erhalten <input type="checkbox" checked></label>
<label>Name <input></label><label>E-Mail <input></label><label>Telefon <input></label><label>Firma <input></label>
<button>Berechnen</button>
<p class="note">Der Preis wird nach dem Absenden per E-Mail zugeschickt. Alle Preise zzgl. MwSt., Mindestauftrag 2.000 €.</p>
</section></body></html>
