<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Kontakt</title><style>body{font-family:system-ui;margin:40px}label{display:block;margin-top:12px}input,textarea{width:320px;padding:8px}#err{color:#c00}</style></head><body><h1>Kontakt</h1><p id="err"></p><form id="f"><label>Name<input name="name"></label><label>E-Mail<input name="email"></label><label>Telefon<input name="tel"></label><label>Nachricht<textarea name="msg"></textarea></label><button>Senden</button></form>
<script>document.getElementById('f').onsubmit=function(e){e.preventDefault();var f=this;var ok=f.email.value.indexOf('@')>0&&f.msg.value.length>10;if(!ok){f.reset();document.getElementById('err').textContent='Fehler im Formular. Bitte erneut ausfüllen.';return}document.body.innerHTML='<p>Danke</p>'}</script></body></html>
