<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beispiel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="theme.css">
<script>
tailwind.config={theme:{extend:{colors:{background:'var(--background)',foreground:'var(--foreground)',card:{DEFAULT:'var(--card)',foreground:'var(--card-foreground)'},muted:{DEFAULT:'var(--muted)',foreground:'var(--muted-foreground)'},primary:{DEFAULT:'var(--primary)',foreground:'var(--primary-foreground)'},secondary:{DEFAULT:'var(--secondary)',foreground:'var(--secondary-foreground)'},accent:{DEFAULT:'var(--accent)',foreground:'var(--accent-foreground)'},destructive:'var(--destructive)',border:'var(--border)',input:'var(--input)',ring:'var(--ring)'},borderRadius:{lg:'var(--radius)',md:'calc(var(--radius) - 2px)',sm:'calc(var(--radius) - 4px)'}}}}
</script>
</head>
<body class="bg-background text-foreground">
<main class="mx-auto max-w-2xl p-8">
  <!-- shadcn/ui Card -->
  <div data-slot="card" class="rounded-lg border bg-card text-card-foreground shadow-sm">
    <div data-slot="card-header" class="flex flex-col gap-1.5 p-6">
      <h3 data-slot="card-title" class="font-semibold leading-none">Profil</h3>
      <p data-slot="card-description" class="text-sm text-muted-foreground">Name und Sprache</p>
    </div>
    <div data-slot="card-content" class="p-6 pt-0">
      <label for="name" data-slot="label" class="text-sm font-medium">Name</label>
      <input id="name" data-slot="input" class="mt-2 flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50">
    </div>
    <div data-slot="card-footer" class="flex items-center p-6 pt-0">
      <button data-slot="button" class="inline-flex h-9 items-center justify-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-xs hover:bg-primary/90 focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50">Speichern</button>
    </div>
  </div>
</main>
</body>
</html>
