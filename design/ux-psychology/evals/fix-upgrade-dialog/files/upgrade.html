<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Upgrade</title>
<style>body{font-family:system-ui;background:#0c0a2b;display:grid;place-items:center;min-height:100vh;margin:0}
.dialog{background:#fff;padding:32px;border-radius:16px;max-width:420px}
.price{font-size:32px;font-weight:700}.primary{display:block;width:100%;padding:12px;background:#4e4cf2;color:#fff;border:0;border-radius:8px;margin-top:20px}
.later{display:block;text-align:center;margin-top:12px;color:#888}</style></head>
<body><div class="dialog">
<h1>Premium freischalten</h1>
<ul><li>200 GB Speicher</li><li>Versionsverlauf</li><li>Geteilte Ordner</li><li>Priorisierter Support</li></ul>
<p class="price">9,99 € / Monat</p>
<button class="primary">Jetzt upgraden</button>
<a class="later" href="#">Vielleicht später</a>
<!-- Kontext aus der App: Nutzerin hat 14,6 von 15 GB belegt; größte Ordner: "Kundenprojekte 2026" (6,2 GB), "Fotos Messe" (3,1 GB). Bei vollem Speicher werden neue Dateien nicht mehr synchronisiert. -->
</div></body></html>
