<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><title>Website-Check</title>
<style>body{font-family:system-ui;margin:0;background:#f5f5f7}main{max-width:520px;margin:40px auto;background:#fff;padding:32px;border-radius:12px}
.progress{height:8px;background:#eee;border-radius:4px}.progress span{display:block;width:0;height:100%;background:#4e4cf2}
.locked{filter:blur(6px);user-select:none}label{display:block;margin-top:14px}input,select{width:100%;padding:10px;margin-top:4px}
button{margin-top:20px;width:100%;padding:12px;background:#4e4cf2;color:#fff;border:0;border-radius:8px}</style></head>
<body><main>
<p>Schritt 1 von 5 · 0 % erledigt</p><div class="progress"><span></span></div>
<h1>Ihr Website-Report ist fertig</h1>
<div class="locked"><p>Score: 64 / 100</p><ul><li>Ladezeit: 4,8 s</li><li>3 Seiten ohne Titel</li><li>Kontaktformular auf dem Handy abgeschnitten</li></ul></div>
<p>Erstellen Sie ein Konto, um Ihren Report zu sehen.</p>
<form>
<label>E-Mail<input type="email"></label>
<label>Passwort<input type="password"></label>
<label>Firmenname<input></label>
<label>Branche<select><option>Bitte wählen</option><option>Handel</option><option>Dienstleistung</option><option>Handwerk</option><option>Gastronomie</option><option>Sonstiges</option></select></label>
<label>Wie haben Sie von uns erfahren?<select><option>Bitte wählen</option><option>Google</option><option>Empfehlung</option><option>Social Media</option></select></label>
<label><input type="checkbox" checked style="width:auto"> Ich möchte den Newsletter erhalten</label>
<button>Registrieren</button>
</form></main></body></html>
